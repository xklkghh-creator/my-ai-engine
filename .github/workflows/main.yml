name: Build DeepSeek Style AI APK
name: Build DeepSeek Style AI APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Android App Project
        run: |
          mkdir -p app/src/main/java/com/myai/chat
          mkdir -p gradle/wrapper

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "MyUnfilteredAI"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.myai.chat'
              compileSdk 34
              defaultConfig {
                  applicationId "com.myai.chat"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://android.com">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:label="My AI"
                  android:theme="@style/Theme.MaterialComponents.DayNight.NoActionBar"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/myai/chat/MainActivity.kt
          package com.myai.chat

          import android.app.AlertDialog
          import android.content.Context
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.os.Bundle
          import android.view.Gravity
          import android.view.View
          import android.widget.*
          import androidx.appcompat.app.AppCompatActivity
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.OutputStreamWriter
          import java.net.HttpURLConnection
          import java.net.URL
          import kotlin.concurrent.thread

          class MainActivity : AppCompatActivity() {

              private lateinit var chatLayout: LinearLayout
              private lateinit var scrollView: ScrollView
              private lateinit var inputEdit: EditText
              private lateinit var sendBtn: Button
              private val messages = JSONArray()

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(Color.parseColor("#0F1117"))
                  }

                  val header = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      setBackgroundColor(Color.parseColor("#161922"))
                      setPadding(36, 36, 36, 36)
                      gravity = Gravity.CENTER_VERTICAL
                  }

                  val title = TextView(this).apply {
                      text = "My AI • Unfiltered"
                      setTextColor(Color.WHITE)
                      textSize = 19f
                      typeface = Typeface.DEFAULT_BOLD
                      layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f)
                  }

                  val clearBtn = Button(this).apply {
                      text = "Сброс"
                      setTextColor(Color.parseColor("#A0A8B8"))
                      setBackgroundColor(Color.TRANSPARENT)
                      setOnClickListener {
                          chatLayout.removeAllViews()
                          while (messages.length() > 0) messages.remove(0)
                          addBubble("Диалог очищен. Задайте вопрос.", false)
                      }
                  }

                  val settingsBtn = Button(this).apply {
                      text = "⚙"
                      textSize = 18f
                      setTextColor(Color.WHITE)
                      setBackgroundColor(Color.TRANSPARENT)
                      setOnClickListener { showSettingsDialog() }
                  }

                  header.addView(title)
                  header.addView(clearBtn)
                  header.addView(settingsBtn)

                  scrollView = ScrollView(this).apply {
                      layoutParams = LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, 0, 1f)
                  }

                  chatLayout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(28, 28, 28, 28)
                  }
                  scrollView.addView(chatLayout)

                  val bottomBar = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      setBackgroundColor(Color.parseColor("#161922"))
                      setPadding(24, 20, 24, 20)
                      gravity = Gravity.CENTER_VERTICAL
                  }

                  inputEdit = EditText(this).apply {
                      hint = "Спросите что угодно..."
                      setHintTextColor(Color.parseColor("#6E7687"))
                      setTextColor(Color.WHITE)
                      textSize = 16f
                      maxLines = 4
                      background = GradientDrawable().apply {
                          setColor(Color.parseColor("#212634"))
                          cornerRadius = 32f
                      }
                      setPadding(36, 24, 36, 24)
                      layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f)
                  }

                  sendBtn = Button(this).apply {
                      text = "➤"
                      textSize = 18f
                      setTextColor(Color.WHITE)
                      background = GradientDrawable().apply {
                          setColor(Color.parseColor("#3B82F6"))
                          cornerRadius = 50f
                      }
                      val lp = LinearLayout.LayoutParams(120, 120)
                      lp.leftMargin = 16
                      layoutParams = lp
                      setOnClickListener { sendMessage() }
                  }

                  bottomBar.addView(inputEdit)
                  bottomBar.addView(sendBtn)

                  root.addView(header)
                  root.addView(scrollView)
                  root.addView(bottomBar)
                  setContentView(root)

                  val prefs = getSharedPreferences("ai_prefs", Context.MODE_PRIVATE)
                  if (prefs.getString("api_key", "").isNullOrEmpty()) {
                      addBubble("Нажмите ⚙ справа сверху и вставьте ваш ключ Hugging Face (hf_...).", false)
                  } else {
                      addBubble("Готов к работе без ограничений. Введите запрос.", false)
                  }
              }

              private fun addBubble(text: String, isUser: Boolean): TextView {
                  val wrapper = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = if (isUser) Gravity.END else Gravity.START
                      val lp = LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT)
                      lp.bottomMargin = 24
                      layoutParams = lp
                  }

                  val tv = TextView(this).apply {
