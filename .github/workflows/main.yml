name: Build Custom AI Engine APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Скачивание исходного кода движка llama.cpp
        run: |
          git clone --depth 1 https://github.com

      - name: Настройка Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Сборка чистого APK под Dimensity 9400 (arm64-v8a)
        working-directory: llama.cpp/examples/llama.android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Загрузка готового APK
        uses: actions/upload-artifact@v4
        with:
          name: MyCustomAIEngine-APK
          path: llama.cpp/examples/llama.android/app/build/outputs/apk/debug/*.apk
          
