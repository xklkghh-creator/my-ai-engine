name: Build Race APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Generate files
      run: |
        python3 - << 'PYEOF'
        import os, base64
        os.makedirs('app/src/main/java/com/race/app', exist_ok=True)
        os.makedirs('app/src/main/res/layout', exist_ok=True)
        files = {}
        files['app/src/main/java/com/race/app/SettingsStore.kt'] = ""
        files['app/src/main/java/com/race/app/AiClient.kt'] = ""
        files['app/src/main/java/com/race/app/RequestBuilder.kt'] = ""
        files['app/src/main/java/com/race/app/MainActivity.kt'] = ""
        files['settings.gradle'] = ""

        for path, b64 in files.items():
            with open(path, 'wb') as f:
                f.write(base64.b64decode(b64))
        PYEOF

    - name: Build APK
      run: |
        gradle wrapper --gradle-version 8.9
        chmod +x ./gradlew
        ./gradlew clean assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Race-APK
        path: app/build/outputs/apk/debug/app-debug.apk
