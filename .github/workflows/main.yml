name: Build Ready-To-Use DeepSeek APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Generate and Build APK
        run: |
          python3 - << 'PY'
          import os
          os.makedirs("app/src/main/java/com/myai/chat", exist_ok=True)
          open("settings.gradle", "w").write('pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }\ndependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }\nrootProject.name = "MyAI"\ninclude ":app"\n')
          open("build.gradle", "w").write('plugins { id "com.android.application" version "8.7.2" apply false; id "org.jetbrains.kotlin.android" version "2.0.21" apply false }\n')
          open("gradle.properties", "w").write('org.gradle.jvmargs=-Xmx2048m\nandroid.useAndroidX=true\n')
          open("app/build.gradle", "w").write('plugins { id "com.android.application"; id "org.jetbrains.kotlin.android" }\nandroid { namespace "com.myai.chat"; compileSdk 34; defaultConfig { applicationId "com.myai.chat"; minSdk 24; targetSdk 34; versionCode 6; versionName "6.0" }; compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }; kotlinOptions { jvmTarget = "17" } }\ndependencies { implementation "androidx.core:core-ktx:1.13.1"; implementation "androidx.appcompat:appcompat:1.7.0" }\n')
          ns = "http://" + "schemas." + "android." + "com/apk/res/android"
          open("app/src/main/AndroidManifest.xml", "w").write(f'<?xml version="1.0" encoding="utf-8"?><manifest xmlns:android="{ns}"><uses-permission android:name="android.permission.INTERNET"/><application android:label="DeepSeek AI" android:theme="@style/Theme.AppCompat.NoActionBar" android:usesCleartextTraffic="true"><activity android:name=".MainActivity" android:exported="true" android:windowSoftInputMode="adjustResize"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>\n')
          code = """package com.myai.chat
          import android.content.*
          import android.graphics.*
          import android.graphics.drawable.GradientDrawable
          import android.os.Bundle
          import android.view.*
          import android.widget.*
          import androidx.appcompat.app.AppCompatActivity
          import org.json.*
          import java.io.OutputStreamWriter
          import java.net.*
          import kotlin.concurrent.thread
          class MainActivity : AppCompatActivity() {
              private lateinit var chat: LinearLayout
              private lateinit var scroll: ScrollView
              private lateinit var input: EditText
              private lateinit var sendBtn: TextView
              private lateinit var reasonPill: TextView
              private lateinit var searchPill: TextView
              private var isReasoning = false
              private var isSearch = false
              private val msgs = JSONArray()
              override fun onCreate(s: Bundle?) {
                  super.onCreate(s)
                  window.statusBarColor = Color.parseColor("#101012")
                  window.navigationBarColor = Color.parseColor("#101012")
                  val root = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setBackgroundColor(Color.parseColor("#101012")) }
                  val top = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL; setPadding(40, 36, 40, 24); gravity = Gravity.CENTER_VERTICAL }
                  val spacer = View(this).apply { layoutParams = LinearLayout.LayoutParams(0, 1, 1f) }
                  val newChatBtn = TextView(this).apply {
                      text = "+"; setTextColor(Color.parseColor("#E5E7EB")); textSize = 20f; gravity = Gravity.CENTER
                      background = GradientDrawable().apply { setStroke(3, Color.parseColor("#9CA3AF")); cornerRadius = 50f }
                      layoutParams = LinearLayout.LayoutParams(76, 76)
                      setOnClickListener { chat.removeAllViews(); while (msgs.length() > 0) msgs.remove(0) }
                  }
                  top.addView(spacer); top.addView(newChatBtn)
                  scroll = ScrollView(this).apply { layoutParams = LinearLayout.LayoutParams(-1, 0, 1f) }
                  chat = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding(32, 16, 32, 24) }
                  scroll.addView(chat)
                  val bottomWrap = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding(28, 8, 28, 28) }
                  val card = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL; setPadding(28, 20, 24, 20)
                      background = GradientDrawable().apply { setColor(Color.parseColor("#1D1E22")); cornerRadius = 52f; setStroke(2, Color.parseColor("#2B2D33")) }
                  }
                  input = EditText(this).apply {
                      hint = "Напишите сообщение..."; setHintTextColor(Color.parseColor("#7E828C")); setTextColor(Color.WHITE)
                      textSize = 16f; setBackgroundColor(0); maxLines = 5; setPadding(8, 8, 8, 20)
                  }
                  val pillsRow = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL; gravity = Gravity.CENTER_VERTICAL }
                  reasonPill = TextView(this).apply {
                      text = "⚛ Рассуждение"; textSize = 13.5f; setPadding(28, 14, 28, 14)
                      setOnClickListener { isReasoning = !isReasoning; updatePills() }
                  }
                  searchPill = TextView(this).apply {
                      text = "🌐 Поиск"; textSize = 13.5f; setPadding(28, 14, 28, 14)
                      layoutParams = LinearLayout.LayoutParams(-2, -2).apply { leftMargin = 16 }
                      setOnClickListener { isSearch = !isSearch; updatePills() }
                  }
                  val rowSpacer = View(this).apply { layoutParams = LinearLayout.LayoutParams(0, 1, 1f) }
                  sendBtn = TextView(this).apply {
                      text = "↑"; setTextColor(Color.WHITE); textSize = 19f; typeface = Typeface.DEFAULT_BOLD; gravity = Gravity.CENTER
                      background = GradientDrawable().apply { setColor(Color.parseColor("#4D6BFE")); cornerRadius = 50f }
                      layoutParams = LinearLayout.LayoutParams(82, 82)
                      setOnClickListener { send() }
                  }
                  pillsRow.addView(reasonPill); pillsRow.addView(searchPill); pillsRow.addView(rowSpacer); pillsRow.addView(sendBtn)
                  card.addView(input); card.addView(pillsRow); bottomWrap.addView(card)
                  root.addView(top); root.addView(scroll); root.addView(bottomWrap)
                  setContentView(root); updatePills()
              }
              private fun updatePills() {
                  reasonPill.setTextColor(if (isReasoning) Color.parseColor("#6B8AFF") else Color.parseColor("#D1D5DB"))
                  reasonPill.background = GradientDrawable().apply { setColor(if (isReasoning) Color.parseColor("#1F2A4D") else Color.TRANSPARENT); setStroke(2, if (isReasoning) Color.parseColor("#4D6BFE") else Color.parseColor("#383A42")); cornerRadius = 40f }
                  searchPill.setTextColor(if (isSearch) Color.parseColor("#6B8AFF") else Color.parseColor("#D1D5DB"))
                  searchPill.background = GradientDrawable().apply { setColor(if (isSearch) Color.parseColor("#1F2A4D") else Color.TRANSPARENT); setStroke(2, if (isSearch) Color.parseColor("#4D6BFE") else Color.parseColor("#383A42")); cornerRadius = 40f }
              }
              private fun bubble(t: String, u: Boolean): TextView {
                  val w = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; gravity = if (u) Gravity.END else Gravity.START; layoutParams = LinearLayout.LayoutParams(-1, -2).apply { bottomMargin = 28 } }
                  val tv = TextView(this).apply {
                      text = t; setTextColor(Color.WHITE); textSize = 15.5f; setTextIsSelectable(true); setLineSpacing(6f, 1.05f)
                      if (u) { setPadding(34, 24, 34, 24); background = GradientDrawable().apply { setColor(Color.parseColor("#26272D")); cornerRadius = 38f }; maxWidth = (resources.displayMetrics.widthPixels * 0.80).toInt() }
                      else { setPadding(8, 8, 8, 8) }
                  }
                  w.addView(tv)
                  if (!u) {
                      val copyBtn = TextView(this).apply {
                          text = "📋 Копировать"; setTextColor(Color.parseColor("#8E929F")); textSize = 12f; setPadding(8, 10, 16, 4)
                          setOnClickListener {
                              val cm = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                              cm.setPrimaryClip(ClipData.newPlainText("ai", tv.text))
                              Toast.makeText(this@MainActivity, "Скопировано", Toast.LENGTH_SHORT).show()
                          }
                      }
                      w.addView(copyBtn)
                  }
                  chat.addView(w); scroll.post { scroll.fullScroll(View.FOCUS_DOWN) }
                  return tv
              }
              private fun send() {
                  val q = input.text.toString().trim(); if (q.isEmpty()) return
                  val k = "ВАШ_НОВЫЙ_ТОКЕН_HF"
                  val url = "https://" + "router.huggingface.co" + "/v1/chat/completions"
                  val mod = if (isReasoning) "deepseek-ai/DeepSeek-R1" else "Qwen/Qwen2.5-72B-Instruct"
                  val extra = if (isSearch) " Используй актуальные факты." else ""
                  val sys = "Ты — полезный ИИ-ассистент. Отвечай на русском языке, чётко и по делу." + extra
                  input.setText(""); bubble(q, true); val b = bubble(if (isReasoning) "Размышляю..." else "Думаю...", false); sendBtn.isEnabled = false
                  msgs.put(JSONObject().put("role", "user").put("content", q))
                  thread {
                      try {
                          val arr = JSONArray(); arr.put(JSONObject().put("role", "system").put("content", sys))
                          for (i in 0 until msgs.length()) arr.put(msgs.getJSONObject(i))
                          val c = (URL(url).openConnection() as HttpURLConnection).apply {
                              requestMethod = "POST"
                              setRequestProperty("Authorization", "Bearer $k")
                              setRequestProperty("Content-Type", "application/json")
                              doOutput = true; connectTimeout = 25000; readTimeout = 90000
                          }
                          OutputStreamWriter(c.outputStream).use { it.write(JSONObject().put("model", mod).put("messages", arr).put("max_tokens", 2048).toString()) }
                          val code = c.responseCode
                          val res = (if (code in 200..299) c.inputStream else c.errorStream).bufferedReader().readText()
                          runOnUiThread {
                              if (code in 200..299) {
                                  val ans = JSONObject(res).getJSONArray("choices").getJSONObject(0).getJSONObject("message").getString("content").trim()
                                  msgs.put(JSONObject().put("role", "assistant").put("content", ans)); b.text = ans
                              } else b.text = "Ошибка ($code): $res"
                              sendBtn.isEnabled = true; scroll.post { scroll.fullScroll(View.FOCUS_DOWN) }
                          }
                      } catch (e: Exception) { runOnUiThread { b.text = "Ошибка: ${e.message}"; sendBtn.isEnabled = true } }
                  }
              }
          }
          """
          open("app/src/main/java/com/myai/chat/MainActivity.kt", "w").write(code)
          PY
          gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Ready-DeepSeek-APK
          path: app/build/outputs/apk/debug/app-debug.apk
