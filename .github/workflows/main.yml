name: Build Custom AI Engine APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clone llama.cpp
        run: |
          git clone --depth 1 https://github.com

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Android APK
        working-directory: llama.cpp/examples/llama.android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyCustomAIEngine-APK
          path: llama.cpp/examples/llama.android/app/build/outputs/apk/debug/*.apk
          
